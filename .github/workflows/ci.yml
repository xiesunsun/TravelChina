name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - 'feat/**'
      - 'codex/**'

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install backend deps for generation
        run: |
          cd backend
          uv sync --frozen
      - name: Generate docs artifacts
        run: bash scripts/generate-artifacts.sh
      - name: Docs and architecture lint
        run: |
          bash scripts/doc-lint.sh
          bash scripts/architecture-lint.sh
      - name: Ensure generated artifacts are committed
        run: git diff --exit-code docs/generated/openapi.json docs/generated/db-schema.md

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install backend deps
        run: uv sync --frozen
      - name: Run AI evals
        run: uv run --frozen python ../scripts/run_ai_evals.py
      - name: Run backend tests
        run: uv run --frozen --with pytest pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - name: Install backend deps
        run: |
          cd ../backend
          uv sync --frozen
      - name: Install frontend deps
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run e2e smoke tests
        run: npm run test:e2e
